name: desktop-windows

# Desativado: foco atual e Android. Roda apenas manualmente (workflow_dispatch).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}

      - name: Instalar dependencias
        run: pip install PySide6 av numpy pyinstaller

      - name: Build do executavel
        working-directory: desktop
        run: >
          pyinstaller --noconfirm --windowed --name YooFree
          --icon ..\assets\icon.ico
          --collect-submodules yoofree
          --collect-binaries av
          --collect-data av
          --hidden-import numpy
          --hidden-import av
          --hidden-import av.codec
          --hidden-import av.video
          --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.Qt3DCore
          --exclude-module PySide6.QtMultimedia
          --exclude-module PySide6.QtCharts
          --exclude-module PySide6.QtPdf
          --exclude-module tkinter
          main.py

      - name: Pacote portatil (zip)
        shell: pwsh
        run: Compress-Archive -Path desktop/dist/YooFree/* -DestinationPath "YooFree-windows-${{ matrix.arch }}.zip"

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $cands = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe nao encontrado" }
          Write-Host "ISCC: $iscc"
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Gerar instalador
        working-directory: desktop/packaging
        shell: pwsh
        run: |
          & $env:ISCC "/DArch=${{ matrix.arch }}" "yoofree.iss"
          Get-ChildItem ..\dist_installer | Select-Object Name,Length

      - name: Publicar artifact
        uses: actions/upload-artifact@v4
        with:
          name: yoofree-windows-${{ matrix.arch }}
          path: |
            YooFree-windows-${{ matrix.arch }}.zip
            desktop/dist_installer/YooFree-Setup-${{ matrix.arch }}.exe
          if-no-files-found: error

      - name: Anexar ao release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.1 `
              "YooFree-windows-${{ matrix.arch }}.zip" `
              "desktop/dist_installer/YooFree-Setup-${{ matrix.arch }}.exe" `
              --clobber
          } else {
            Write-Host "release v0.1 ainda nao existe; so artifact"
          }
