name: desktop-linux

# AppImage + tar.gz do cliente desktop (Linux). O Android fica no build.yml.
on:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - 'assets/**'
      - '.github/workflows/desktop-linux.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'assets/**'
      - '.github/workflows/desktop-linux.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag da release (ex.: v0.8). Vazio = apenas builda.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  linux:
    # 22.04 = glibc 2.35: roda em Ubuntu 22.04+, Debian 12+, Fedora 36+, Arch
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: Dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            librsvg2-bin libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libdbus-1-3 libfontconfig1

      - name: Dependencias Python
        run: pip install -r desktop/requirements.txt pyinstaller

      - name: Build do AppImage
        run: bash desktop/packaging/build-appimage.sh

      - name: Build do tar.gz (install.sh)
        working-directory: desktop
        run: bash packaging/build-release.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: yoofree-linux-appimage
          path: |
            YooFree-*.AppImage
            YooFree-*.AppImage.zsync
          if-no-files-found: error

      - name: Upload tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: yoofree-linux-tarball
          path: yoofree-desktop.tar.gz
          if-no-files-found: error

      - name: Publish to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VER="${RELEASE_TAG#v}"
          APPIMAGE="YooFree-${VER}-x86_64.AppImage"
          # nomes fixos: o site/README apontam pra releases/latest/download/...
          cp "$APPIMAGE" YooFree-x86_64.AppImage
          ASSETS=("$APPIMAGE" YooFree-x86_64.AppImage yoofree-desktop.tar.gz)
          [ -f "$APPIMAGE.zsync" ] && ASSETS+=("$APPIMAGE.zsync")

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          else
            NOTES=$(printf '%s\n- %s: AppImage (sem root, roda em qualquer distro)\n- %s: tar.gz + install.sh (instala em ~/.local)' \
              "Desktop Linux ${RELEASE_TAG} gerado pelo workflow desktop-linux, commit ${GITHUB_SHA:0:7}" \
              "YooFree-x86_64.AppImage" "yoofree-desktop.tar.gz")
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "YooFree ${VER}" \
              --notes "$NOTES"
          fi
