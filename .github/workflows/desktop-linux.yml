name: desktop-linux

# AppImage + tar.gz do cliente desktop (Linux). O Android fica no build.yml.
on:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - 'assets/**'
      - '.github/workflows/desktop-linux.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'assets/**'
      - '.github/workflows/desktop-linux.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag da release (ex.: v0.8). Vazio = apenas builda.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  linux:
    # 22.04 = glibc 2.35: roda em Ubuntu 22.04+, Debian 12+, Fedora 36+, Arch
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements.txt

      - name: Dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            librsvg2-bin libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libdbus-1-3 libfontconfig1

      - name: Dependencias Python
        run: pip install -r desktop/requirements.txt pyinstaller

      - name: Build do AppImage
        run: bash desktop/packaging/build-appimage.sh

      - name: Build do tar.gz (install.sh)
        working-directory: desktop
        run: bash packaging/build-release.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: yoofree-linux-appimage
          path: |
            YooFree-*.AppImage
            YooFree-*.AppImage.zsync
          if-no-files-found: error

      - name: Upload tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: yoofree-linux-tarball
          path: yoofree-desktop.tar.gz
          if-no-files-found: error

      - name: Publish to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          VERSION="$(ls YooFree-*-x86_64.AppImage | sed -E 's#^YooFree-(.*)-x86_64\.AppImage$#\1#')"
          # nomes fixos dentro da release: o site/README/install.sh apontam pra
          # releases/download/desktop-latest/<arquivo>
          cp "YooFree-${VERSION}-x86_64.AppImage" YooFree-x86_64.AppImage
          ASSETS=(YooFree-x86_64.AppImage yoofree-desktop.tar.gz)
          # o .zsync so vai na release versionada (o nome interno dele fixa a versao)
          if [ -f "YooFree-${VERSION}-x86_64.AppImage.zsync" ]; then
            ASSETS+=("YooFree-${VERSION}-x86_64.AppImage.zsync")
          fi
          NOTES="Desktop Linux ${VERSION} (tag ${TAG}), commit ${GITHUB_SHA:0:7}
          - YooFree-x86_64.AppImage: sem root, roda em Ubuntu 22.04+/Debian 12+/Fedora 36+/Arch
          - yoofree-desktop.tar.gz: install.sh, instala em ~/.local"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --target "$GITHUB_SHA" \
              --title "YooFree desktop ${VERSION}" \
              --notes "$NOTES"
          fi

          # alias rolling: link estavel, independente de quantas releases existam
          if ! gh release view desktop-latest >/dev/null 2>&1; then
            gh release create desktop-latest --target "$GITHUB_SHA" --prerelease \
              --title "YooFree desktop (latest)" \
              --notes "Aponta sempre para o AppImage/tar.gz mais recente do desktop Linux.
          O arquivo versionado fica na release desktop-v<versao>."
          fi
          gh release upload desktop-latest YooFree-x86_64.AppImage yoofree-desktop.tar.gz --clobber
