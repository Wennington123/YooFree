name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag da release (ex.: v0.7). Vazio = apenas builda o APK.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Accept licenses and ensure SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Prepare signing key
        env:
          YOOFREE_KEYSTORE_BASE64: ${{ secrets.YOOFREE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$YOOFREE_KEYSTORE_BASE64" ]; then
            echo "$YOOFREE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yoofree-release.jks"
            echo "YOOFREE_STORE_FILE=$RUNNER_TEMP/yoofree-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APKs (release + debug)
        env:
          YOOFREE_STORE_PASSWORD: ${{ secrets.YOOFREE_STORE_PASSWORD }}
          YOOFREE_KEY_ALIAS: ${{ secrets.YOOFREE_KEY_ALIAS }}
          YOOFREE_KEY_PASSWORD: ${{ secrets.YOOFREE_KEY_PASSWORD }}
        run: |
          if [ -n "$YOOFREE_STORE_FILE" ]; then
            ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace
            echo "RELEASE_APK=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
            echo "RELEASE_APK=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi
          echo "DEBUG_APK=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yoofree-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish APKs to release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          NAME="YooFree-${RELEASE_TAG#v}.apk"
          NAME_DEBUG="YooFree-${RELEASE_TAG#v}-debug.apk"
          cp "$RELEASE_APK" "$NAME"
          # nome fixo: o site aponta direto pra
          # releases/latest/download/YooFree.apk
          cp "$RELEASE_APK" "YooFree.apk"
          cp "$DEBUG_APK" "$NAME_DEBUG"
          NOTES=$(printf '%s\n- %s: assinada (instalar por cima da anterior)\n- %s: debug (para diagnostico, nao atualiza a assinada)' \
            "APK Android ${RELEASE_TAG} gerado pelo workflow build, commit ${GITHUB_SHA:0:7}" \
            "$NAME" "$NAME_DEBUG")
          gh release create "$RELEASE_TAG" "$NAME" "YooFree.apk" "$NAME_DEBUG" \
            --target "$GITHUB_SHA" \
            --title "YooFree ${RELEASE_TAG#v}" \
            --notes "$NOTES"
